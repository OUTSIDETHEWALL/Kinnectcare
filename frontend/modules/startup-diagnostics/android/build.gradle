plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.startupdiagnostics'
version = '1.0.0'

expoModule {
  canBePublished false
}

dependencies {
  // Expo core's implementation dependency does not expose NetworkingModule.
  // Use the app's existing RN artifact/version (including its OkHttp API), not
  // a new networking library or a different runtime transport.
  compileOnly 'com.facebook.react:react-android'
}

android {
  namespace "expo.modules.startupdiagnostics"
  defaultConfig {
    consumerProguardFiles 'consumer-rules.pro'
    versionCode 1
    versionName '1.0.0'
  }
}